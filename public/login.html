<!doctype html>
<html lang="pl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Logowanie - BeanShop</title><link rel="stylesheet" href="/styles.css"></head>
<body>
<header><a class="logo" href="/">BeanShop</a><nav></nav></header>
<main>
  <h1>Logowanie</h1>
  <form class="stack" id="login-form">
    <label for="email">E-mail</label>
    <input id="email" name="email" type="email" autocomplete="username" required>
    <label for="password">Hasło</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit" id="login-submit">Zaloguj się</button>
    <div class="error" id="login-error"></div>
  </form>
  <p>Nie masz konta? <a href="/register">Załóż konto</a></p>
</main>
<script src="/app.js"></script>
<script>
const { api, renderHeader } = window.BeanShop;
renderHeader();
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const error = document.getElementById('login-error');
  error.textContent = '';
  try {
    await api('/auth/login', { method: 'POST', body: { email: e.target.email.value, password: e.target.password.value } });
    location.href = new URLSearchParams(location.search).get('next') || '/';
  } catch (err) { error.textContent = err.message; }
});
</script>
</body>
</html>
